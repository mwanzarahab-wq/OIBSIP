<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mitengo | Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <header class="top">
    <h1 class="logo">Mitengo</h1>
    <p class="sub">Zambian price checker</p>
  </header>
  <div class="stripe">COMPARE. SAVE. SHOP SMART.</div>

  <main class="folder">
    <nav class="tabs" aria-label="Account">
      <a class="tab active" href="login.html" aria-current="page">Log in</a>
      <a class="tab" href="register.html">Register</a>
    </nav>
    <section class="panel">
      <h2>Welcome back</h2>
      <p class="hint">Log in to see your basket and watchlist.</p>

      <div id="msg" class="msg" role="alert" hidden></div>

      <form id="form" novalidate>
        <label for="identifier">Username or email</label>
        <input id="identifier" type="text" autocomplete="username" placeholder="e.g. rahab or rahab@mail.com">

        <label for="password">Password</label>
        <div class="field">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password">
          <button type="button" class="show-btn" data-for="password">Show</button>
        </div>

        <button id="submit" class="btn" type="submit">Log in</button>
      </form>
      <p class="swap">No account yet? <a href="register.html">Register here</a></p>
    </section>
  </main>
  <p class="foot">Prices are reported by shoppers and may be out of date. Check in store.</p>
  <script src="auth.js"></script>
</body>
</html>
