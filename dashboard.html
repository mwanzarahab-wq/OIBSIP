<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mitengo | My account</title>
  <!-- protected page: no session means straight back to login, before anything is drawn -->
  <script>if (!sessionStorage.getItem('mitengo_session')) location.replace('login.html');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard" hidden>
  <header class="top">
    <h1 class="logo">Mitengo</h1>
    <button id="logout" class="btn plain" type="button">Log out</button>
  </header>
  <div class="stripe">COMPARE. SAVE. SHOP SMART.</div>

  <main class="dash">
    <h2>Hello, <span id="who"></span></h2>
    <p class="hint">You are logged in. Only people with a session can see this page.</p>

    <section class="card">
      <h3>Your account</h3>
      <div class="row"><span>Signed in as</span><strong id="info-name"></strong></div>
      <div class="row"><span>Account created</span><strong id="info-created"></strong></div>
      <div class="row"><span>This session started</span><strong id="info-login"></strong></div>
    </section>

    <section class="card">
      <h3>Best buy today</h3>
      <p style="margin:0 0 8px;font-weight:700">Mealie meal 25kg</p>
      <div class="best"><span>Soweto Market</span><b>K255</b></div>
      <p class="small">Sample data only.</p>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
